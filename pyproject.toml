[project]
name = "openmontage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "faster-whisper>=1.2.1",
    "jsonschema>=4.26.0",
    "ngrok>=1.7.0",
    "opencc-python-reimplemented>=0.1.7",
    "opencv-python-headless<5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "rq>=2.10.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

# 可选依赖组：不进默认安装（whisperx 会带进 torch/transformers/pyannote-audio，
# 几百 MB+，多数场景用不上）。装了才会被 forced_alignment.py 用起来，没装就
# 优雅退回 faster-whisper 自己的词级时间戳——跟 eye_enhance 需要 mediapipe/
# opencv-python 时的处理方式一致（见 pipeline_runner.py 的注释）。
# 安装：uv sync --extra align
[project.optional-dependencies]
align = [
    "whisperx>=3.8.6",
]
