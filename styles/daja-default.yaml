# Ported from VeLL-lab/video-studio's CLAUDE-daja-default.md, where it's the
# manual pipeline's fallback style when no preset is named.
#
# For the WhatsApp bot specifically, this is NOT wired up as a fallback and
# there is no plan to build one: xiaojin-editorial is the bot's actual (and
# only) house style — apply_style always renders it, regardless of whether a
# style was named. This file exists purely so the daja-default token palette
# is preserved/documented for reference, not as a pending gap to close.

identity:
  name: "DAJA Default"
  category: talking-head
  mood: "bold, playful, techy — AI educator persona"
  pace: energetic
  best_for: "AI/tech educational content aimed at a younger, online-native audience"

visual_language:
  color_palette:
    english:
      primary: ["#FFAA33"]
      background: "#FFF3DC"
      panel: "rgba(13,17,23,0.86)"
    cantonese:
      primary: ["#3DE0FF", "#E4FF7E"]
      panel: "rgba(13,17,23,0.86)"
  composition: "dark semi-transparent overlay cards/chips over full-bleed footage"
  texture: "sparkle burst particles, animated processing dots, icon clusters"

typography:
  headings:
    font: "Arial"
    weight: 700
  body:
    font: "Arial"
    weight: 700
  cantonese_font: "JhengHei Bold"
  scale_system: "minor_third"
  weight_matrix:
    title: 700
    heading: 700
    body: 700
    caption: 700

motion:
  transitions: [fade]
  animation_style: "spring back.out, scale 0.6 -> 1.08 -> 1.0"
  pacing_rules:
    chip_entrance_overshoot: 1.08
  entrance: "spring back.out scale pop"
  exit: "fade"

audio:
  voice_style: "energetic, casual, fast-paced"
  music_mood: "upbeat, tech-adjacent"
  music_volume: 0.12

overlays:
  key_term:
    style: "keyword color-pop within subtitle text"
    caption_fade: "fad(140,90)"

quality_rules:
  - "Subtitles are sentence-case, not ALL CAPS"
  - "Keyword color-pops highlight at most 1-2 terms per phrase — do not over-highlight"
  - "Cantonese content uses JhengHei Bold; English content uses Arial Bold — do not mix"

color_rules:
  harmony_type: "complementary"
  contrast_validation: true
  colorblind_safe: false
