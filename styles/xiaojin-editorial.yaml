# Ported from VeLL-lab/video-studio's CLAUDE-xiaojin-editorial.md.
# Source reference: 陈与小金 (XiaoHongShu), 4 reference reels analyzed there.
# Pairs with remotion-composer's XiaojinEditorial.tsx composition — this
# playbook's tokens and that component's props are meant to be read together;
# neither is authoritative on its own.

identity:
  name: "Xiaojin Editorial"
  category: talking-head
  mood: "quiet, premium, editorial — like a Notion/Linear product page come to life"
  pace: moderate
  best_for: "Talking-head explainers, tutorials, product walkthroughs where credibility matters more than energy"

visual_language:
  color_palette:
    # Two modes — pick by topic tone, do not blend them in one build.
    warm:
      primary: ["#C4714A", "#E0552F"]
      background: "#F2EBE0"
      background_deep: "#E7DCC9"
      card: "#FFFFFF"
      text: "#2A2620"
      muted: "#7A7060"
    dark:
      primary: ["#4D9EFF", "#7CB8FF"]
      background: "#0D1117"
      background_deep: "#090C10"
      card: "#161B22"
      text: "#F0F2F5"
      muted: "#9AA4B2"
  composition: "speaker card floats off-center, never full-bleed; content side builds progressively"
  texture: "faint scattered atmosphere elements (code snippets, filenames) at 15-20% opacity, texture not information"

typography:
  headings:
    font: "Inter"
    weight: 700
  body:
    font: "Inter"
    weight: 500
  sublabel:
    font: "Inter"
    weight: 300
    tracking: "0.05em"
    case: uppercase
  scale_system: "major_third"
  weight_matrix:
    title: 800
    heading: 700
    body: 500
    caption: 700

motion:
  transitions: [hard-cut]
  animation_style: "spring(damping:18, stiffness:120), clean arrival, no overshoot"
  pacing_rules:
    card_reposition_transition_seconds: 0.6
    pill_row_stagger_frames: 5
    atmosphere_drift_px_per_frame: 0.08
  entrance: "translateY + fade, spring damping 18 stiffness 120"
  exit: "hard cut — do not add a transition effect between sections"

audio:
  voice_style: "calm, confident, unhurried"
  music_mood: "minimal or none — the visual system carries the video"
  music_volume: 0.05

overlays:
  speaker_card:
    border_radius: 28
    border: "5px solid card color"
    shadow: "0 36px 90px shadow, 0 12px 32px rgba(0,0,0,0.20)"
    never_full_bleed: true
  chapter_nav:
    height: 88
    position: "pinned top, y=0"
    background: "rgba(255,255,255,0.60) warm / rgba(13,17,23,0.72) dark, blur(8px)"
  compliance_bar:
    height: 88
    position: "pinned bottom, y=1824"
    required_for: "regulated content (e.g. insurance) — persistent every frame"
  key_term:
    bg: "#FFFFFF"
    text: "#C4714A"
    radius: 8
    note: "used for card-based pill rows, NOT for inline caption text recoloring"

quality_rules:
  - "Card bottom <= 1800px in every scene position (compliance bar sits at y=1824 — 48px clearance required)"
  - "Captions pinned at bottom=90 throughout — no per-section overrides"
  - "No content in ChapterNav zone (y=0-88) other than the nav bar itself"
  - "Speaker card shows face + chest/shoulders — face at 20-40% from top of card, body visible below. Head-only framing fails this rule."
  - "objectPosition must be calibrated per source video (face_center_y / source_height * 100) — never reuse a fixed value across different source videos"
  - "Karaoke caption sweep must use direct phrase lookup (captions.find), never createTikTokStyleCaptions, for Cantonese/Mandarin content — that helper merges tokens into one page and breaks sync"
  - "No two beats occupying the same screen position may overlap — new occupant's entrance must be at or after the previous occupant's exit"
  - "Minimum contrast ratio 4.5:1 for all text"

color_rules:
  harmony_type: "monochromatic with single accent"
  contrast_validation: true
  colorblind_safe: true
